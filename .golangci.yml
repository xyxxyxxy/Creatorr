version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - encoding/json.Marshal
        - (*encoding/json.Encoder).Encode
  exclusions:
    rules:
      - path: internal/api/gen/
        linters:
          - errcheck
          - unused
