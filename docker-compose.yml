# Production Compose: pulls GHCR image. Host ./var mirrors container mounts.
# Dev: docker compose -f docker-compose.dev.yml up -d --build
#   or: ./scripts/compose up -d --build
services:
  creatorr:
    image: ghcr.io/xyxxyxxy/creatorr:latest
    container_name: creatorr
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      creatorr-po-token:
        condition: service_healthy
      creatorr-flaresolverr:
        condition: service_healthy
    ports:
      - "8787:8787"
    volumes:
      - ./var/data:/data
      - ./var/import:/import
      # Initial root folder: host CREATORR_INITIAL_ROOT_FOLDER.
      # Override the host path in .env before first boot. Add more roots in Settings → Library.
      - ${CREATORR_INITIAL_ROOT_FOLDER:-./var/library}:/library
      # Optional yt-dlp plugins:
      # - ./var/yt-dlp-plugins:/yt-dlp-plugins:ro
      # Optional custom yt-dlp binary:
      # - /path/to/your/yt-dlp:/usr/local/bin/yt-dlp:ro
    environment:
      # PO Token provider (creatorr-po-token sidecar). Empty disables Settings pot_fetch.
      # Use ${VAR-default} (no colon) so an empty .env value disables instead of restoring the default.
      CREATORR_POT_PROVIDER_URL: ${CREATORR_POT_PROVIDER_URL-http://creatorr-po-token:4416}
      # FlareSolverr base URL (creatorr-flaresolverr sidecar). Chrome-based; notable RAM.
      # Empty skips health probe and Use FlareSolverr (flags cleared on boot).
      CREATORR_FLARESOLVERR_URL: ${CREATORR_FLARESOLVERR_URL-http://creatorr-flaresolverr:8191}
      # UI cron labels use process local time (fires stay UTC). Override via .env TZ=.
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Needed for PO token support (yt-dlp attestation provider).
  creatorr-po-token:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
    container_name: creatorr-po-token
    init: true
    healthcheck:
      # Image has Deno, not curl; /ping is the provider health endpoint.
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:4416/ping'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # CloudFlare challenge solver (optional; enable Use FlareSolverr per host).
  # Headless Chrome uses notable RAM; do not publish 8191 to the host by default.
  creatorr-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: creatorr-flaresolverr
    init: true
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
