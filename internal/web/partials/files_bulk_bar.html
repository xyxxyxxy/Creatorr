{{define "files_bulk_bar"}}
{{/* Dot: FilterTotal, ShowSelectAll - above list|table (same pattern as video_bulk_bar). */}}
<ul class="list bg-base-100 rounded-box border border-base-300 mb-3 hidden" id="files-bulk-bar-wrap">
  <li id="files-bulk-bar"
      class="list-row py-2 hidden"
      data-files-bulk-bar
      style="--list-grid-cols: max-content 1fr max-content">
    <div class="self-center flex items-center gap-3">
      <input type="checkbox" class="checkbox checkbox-sm" id="files-select-page"
             aria-label="Select all on this page" />
      <div class="text-sm tabular-nums opacity-70 whitespace-nowrap">
        <span data-files-bulk-count>0/{{.FilterTotal}}</span>
        <span>selected</span>
      </div>
    </div>
    <div class="list-col-grow min-w-0 flex flex-wrap items-center gap-2 self-center">
      {{if .ShowSelectAll}}
      <button type="button"
              class="btn btn-ghost btn-sm"
              data-files-select-all-matching>
        <i data-lucide="list-checks" class="size-4"></i>
        Select all
      </button>
      {{end}}
    </div>
    <div class="self-center justify-self-end">
      <div class="join">
        <button type="button" class="btn join-item tooltip tooltip-top" data-files-bulk-check data-tip="Check integrity" aria-label="Check integrity" disabled>
          <i data-lucide="shield-check" class="size-4"></i>
          Check integrity
        </button>
        <button type="button" class="btn btn-soft btn-error btn-square join-item tooltip tooltip-top" data-files-bulk-delete data-tip="Delete" aria-label="Delete" disabled>
          <i data-lucide="trash-2" class="size-4"></i>
        </button>
      </div>
    </div>
  </li>
</ul>
{{end}}
