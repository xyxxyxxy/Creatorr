{{define "series_monitor_indicator"}}
{{/* Left of series list title: always monitored | unmonitored (Kind + Title). */}}
<span class="inline-flex items-center justify-center shrink-0 size-5 tooltip tooltip-top"
      data-tip="{{.Title}}"
      aria-label="{{.Title}}">
  {{if eq .Kind "monitored"}}
  <i data-lucide="bookmark" class="size-5 text-success"></i>
  {{else}}
  <i data-lucide="bookmark-off" class="size-5 opacity-50"></i>
  {{end}}
</span>
{{end}}
