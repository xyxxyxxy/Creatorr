{{define "notification_row"}}
<tr class="hover cursor-pointer{{if .Unread}} font-semibold{{end}}" onclick="location.href='/notification/{{.ID}}'">
  <td class="w-10">
    {{if eq .Level "alert"}}
    <span class="inline-flex tooltip tooltip-top text-error" data-tip="alert" aria-label="alert">
      <i data-lucide="megaphone" class="size-4"></i>
    </span>
    {{else if eq .Level "warning"}}
    <span class="inline-flex tooltip tooltip-top text-warning" data-tip="warning" aria-label="warning">
      <i data-lucide="triangle-alert" class="size-4"></i>
    </span>
    {{else}}
    <span class="inline-flex tooltip tooltip-top" data-tip="info" aria-label="info">
      <i data-lucide="bell" class="size-4 opacity-70"></i>
    </span>
    {{end}}
  </td>
  <td class="text-sm{{if .Unread}} text-error{{end}}">{{.EventLabel}}</td>
  <td class="text-xs whitespace-nowrap">{{template "rel_time" .}}</td>
  <td class="text-sm max-w-md truncate{{if .Unread}} text-error{{end}}">{{.Title}}</td>
</tr>
{{end}}
